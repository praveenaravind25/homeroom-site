<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Homeroom</title>
<style>
  html, body { margin: 0; height: 100%; background: #12100E; color: #F7F4EE; font: 500 18px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px; }
  h1 { margin: 0; font-size: clamp(40px, 8vw, 88px); letter-spacing: -0.02em; font-weight: 700; }
  p { margin: 0; color: #CFC8BB; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #EDC67C; margin-right: 8px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <h1>Homeroom</h1>
  <p><span class="dot"></span>A photo frame that knows the household. Coming soon.</p>
</main>
</body>
</html>
